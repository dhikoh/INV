version: "3.8"

services:
  omnicat-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnicat_server
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=/app/data/omnicat_local.db
      - OMNICAT_JWT_SECRET=${OMNICAT_JWT_SECRET:-omnicat_production_strong_key_2026_required}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    volumes:
      - omnicat_data:/app/data

volumes:
  omnicat_data:

